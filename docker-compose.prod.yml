version: '3.8'

services:
  pokemon-showdown:
    build: .
    container_name: pokemon-showdown-server
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - showdown-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: pokemon-showdown-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pokemon-showdown
    restart: unless-stopped
    networks:
      - showdown-network

networks:
  showdown-network:
    driver: bridge
