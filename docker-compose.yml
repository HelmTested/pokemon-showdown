version: '3.8'

services:
  pokemon-showdown:
    build: .
    container_name: pokemon-showdown-server
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Optional: set memory limit
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
